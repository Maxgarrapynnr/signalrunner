services:
  web:
    build: .
    image: signalrunner:latest
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      SECRET_KEY: "${SECRET_KEY}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      DEBUG: "${DEBUG:-False}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      DATA_DIR: "/app/data"
      TIME_ZONE: "${TIME_ZONE:-Africa/Casablanca}"
      Q_WORKERS: "${Q_WORKERS:-2}"
      WEB_WORKERS: "${WEB_WORKERS:-3}"
      MARKETDATA_PROVIDER: "${MARKETDATA_PROVIDER:-casabourse}"
      MARKETDATA_CACHE_TTL_SECONDS: "${MARKETDATA_CACHE_TTL_SECONDS:-300}"
      SNAPSHOT_RETENTION_DAYS: "${SNAPSHOT_RETENTION_DAYS:-30}"
    volumes:
      - signalrunner_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/accounts/login/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  signalrunner_data:
